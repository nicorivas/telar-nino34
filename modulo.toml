# Módulo de telar: lo que este repositorio aporta a telar (ver docs/configuracion.md de telar, [modulos]).
# Se instala con `telar modulos instalar https://github.com/nicorivas/telar-nino34` en cada máquina: la que
# muestra la app y la que corre los periódicos (en esa, después, `telar periodicos aplicar`).
nombre = "nino34"
descripcion = "la temperatura del mar en Niño 3.4 y el mapa del Pacífico"

[app]
nombre = "niño 3.4"
pagina = ["bin/nino34", "pagina"]

[periodicos.bajar]
cuando = "30 7,15 * * *"
comando = "bin/nino34 bajar"
descripcion = "baja la serie diaria de Niño 3.4 (Climate Reanalyzer) y el mapa del Pacífico (NCEI)"

[resultado]
carpeta = "~/.local/state/nino34"

[requiere]
programas = ["uv"]   # el mapa: bin/pacifico-sst corre con uv, que instala netCDF4 solo

# lo que pide fuera de su carpeta: se muestra antes de instalarlo (telar todavía no lo hace cumplir)
[permisos]
leer = []
escribir = ["~/.local/state/nino34"]
red = ["climatereanalyzer.org", "www.ncei.noaa.gov", "pypi.org (uv, para el mapa)"]
ordenes = []
